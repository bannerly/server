name: deploy

# main への push で Cloudflare Workers へ自動デプロイする。
# 必要な Secrets（リポジトリ Settings > Secrets and variables > Actions）:
#   CLOUDFLARE_API_TOKEN   … Workers / D1 / KV / Queues の編集権限を持つトークン
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare アカウント ID
# wrangler.toml の ID（D1 / KV）は scripts/setup.sh で設定済みであること。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "D1 スキーマ（schema.sql）を適用してからデプロイする"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply D1 schema
        if: ${{ inputs.apply_schema }}
        run: npx wrangler d1 execute slotly --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
